<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Timetable Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --dark: #0f172a;
            --darker: #0b1120;
            --light: #f1f5f9;
            --glass: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--darker), #1e293b);
            color: var(--light);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }
        
        .background-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        
        .floating-shape {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            opacity: 0.1;
            filter: blur(40px);
            animation: float 15s infinite linear;
        }
        
        .shape-1 {
            width: 300px;
            height: 300px;
            top: 10%;
            left: 5%;
            animation-duration: 20s;
        }
        
        .shape-2 {
            width: 200px;
            height: 200px;
            bottom: 15%;
            right: 10%;
            animation-duration: 25s;
            animation-direction: reverse;
        }
        
        .shape-3 {
            width: 150px;
            height: 150px;
            top: 40%;
            right: 20%;
            animation-duration: 18s;
        }
        
        @keyframes float {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(20px, 30px) rotate(90deg);
            }
            50% {
                transform: translate(0, 60px) rotate(180deg);
            }
            75% {
                transform: translate(-20px, 30px) rotate(270deg);
            }
            100% {
                transform: translate(0, 0) rotate(360deg);
            }
        }
        
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform-style: preserve-3d;
            perspective: 1000px;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .glass-card:hover {
            transform: translateY(-10px) rotateX(5deg);
            box-shadow: 0 35px 60px -15px rgba(0, 0, 0, 0.6);
        }
        
        .form-input, select {
            background-color: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--glass-border);
            color: var(--light);
            border-radius: 12px;
            padding: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
        }
        
        .btn-primary:hover::before {
            opacity: 1;
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .card-header {
            position: relative;
            padding-bottom: 1.5rem;
        }
        
        .card-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(to right, var(--primary), var(--accent));
            border-radius: 2px;
        }
        
        .toggle-link {
            color: var(--primary);
            transition: all 0.3s ease;
            position: relative;
        }
        
        .toggle-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: width 0.3s ease;
        }
        
        .toggle-link:hover {
            color: var(--accent);
        }
        
        .toggle-link:hover::after {
            width: 100%;
        }
        
        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }
        
        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
        }
        
        .form-input.with-icon {
            padding-left: 3rem;
        }
        
        .role-selector {
            position: relative;
        }
        
        .role-selector::after {
            content: '\f078';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            pointer-events: none;
        }
        
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            border-radius: 50%;
            background: var(--primary);
            opacity: 0.5;
            animation: particle-float 15s infinite linear;
        }
        
        @keyframes particle-float {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }
        
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        
        .logo-icon {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-right: 0.75rem;
        }
        
        .logo-text {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .hidden {
            display: none;
        }
        
        .animate__animated.animate__fadeInDown {
            --animate-duration: 0.8s;
        }
        
        .animate__animated.animate__fadeInUp {
            --animate-duration: 0.8s;
        }
        
        .animate__animated.animate__bounceIn {
            --animate-duration: 1s;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            transform: translateX(150%);
            transition: transform 0.5s ease;
            z-index: 1000;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .notification.success {
            border-left: 4px solid var(--primary);
        }
        
        .notification.error {
            border-left: 4px solid var(--accent);
        }
        
        @media (max-width: 768px) {
            .min-h-screen {
                padding: 1rem;
            }
            
            .glass-card {
                width: 100%;
                max-width: 100%;
            }
        }
    </style>
</head>
<body class="text-gray-200 bg-gray-900">
    <!-- Background Animation -->
    <div class="background-animation">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
        <div class="particles" id="particles"></div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification">
        <span id="notification-message"></span>
    </div>

    <div class="min-h-screen flex items-center justify-end px-4 sm:px-6 lg:px-8">
        <div class="w-full max-w-md mr-0 md:mr-20">
            <!-- Login Card -->
            <div id="login-card" class="glass-card p-8 rounded-xl shadow-2xl animate__animated animate__fadeInRight">
                <div class="logo animate__animated animate__bounceIn">
                    <i class="fas fa-calendar-alt logo-icon"></i>
                    <span class="logo-text">AI Timetable</span>
                </div>
                
                <header class="card-header text-center mb-8 animate__animated animate__fadeInDown">
                    <h1 class="text-3xl font-bold text-white">Welcome Back</h1>
                    <p class="text-md text-gray-400 mt-2">Please log in to continue</p>
                </header>
                
                <form id="login-form" class="animate__animated animate__fadeInUp">
                    <div class="input-group">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="login-email" class="form-input with-icon w-full rounded-lg border-2" placeholder="admin@example.com" required>
                    </div>
                    
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="login-password" class="form-input with-icon w-full rounded-lg border-2" placeholder="••••••••" required>
                    </div>
                    
                    <div class="mb-6 role-selector">
                        <label for="role-selector" class="block mb-2 text-sm font-medium text-gray-300">Login as</label>
                        <select id="role-selector" class="form-input w-full rounded-lg border-2">
                            <option value="admin">Administrator</option>
                            <option value="user">Faculty User</option>
                            <option value="student">Student</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="w-full btn-primary font-bold py-3 px-4 rounded-lg transform hover:scale-105">
                        <i class="fas fa-sign-in-alt mr-2"></i> Sign In
                    </button>
                    
                    <p class="text-sm text-center text-gray-400 mt-6">
                        Don't have an account? 
                        <a href="#" id="show-signup" class="font-medium toggle-link">Sign up</a>
                    </p>
                </form>
            </div>

            <!-- Signup Card -->
            <div id="signup-card" class="glass-card p-8 rounded-xl shadow-2xl hidden animate__animated animate__fadeInRight">
                <div class="logo animate__animated animate__bounceIn">
                    <i class="fas fa-calendar-alt logo-icon"></i>
                    <span class="logo-text">AI Timetable</span>
                </div>
                
                <header class="card-header text-center mb-8 animate__animated animate__fadeInDown">
                    <h1 class="text-3xl font-bold text-white">Create Account</h1>
                    <p class="text-md text-gray-400 mt-2">Get started with our generator</p>
                </header>
                
                <form id="signup-form" class="animate__animated animate__fadeInUp">
                    <div class="input-group">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="signup-name" class="form-input with-icon w-full rounded-lg border-2" placeholder="Your Full Name" required>
                    </div>
                    
                    <div class="input-group">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="signup-email" class="form-input with-icon w-full rounded-lg border-2" placeholder="name@company.com" required>
                    </div>
                    
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="signup-password" class="form-input with-icon w-full rounded-lg border-2" placeholder="••••••••" required>
                    </div>
                    
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="confirm-password" class="form-input with-icon w-full rounded-lg border-2" placeholder="••••••••" required>
                    </div>
                    
                    <button type="submit" class="w-full btn-primary font-bold py-3 px-4 rounded-lg transform hover:scale-105">
                        <i class="fas fa-user-plus mr-2"></i> Create Account
                    </button>
                    
                    <p class="text-sm text-center text-gray-400 mt-6">
                        Already have an account? 
                        <a href="#" id="show-login" class="font-medium toggle-link">Login</a>
                    </p>
                    
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginCard = document.getElementById('login-card');
            const signupCard = document.getElementById('signup-card');
            const showSignupLink = document.getElementById('show-signup');
            const showLoginLink = document.getElementById('show-login');
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const roleSelector = document.getElementById('role-selector');
            const notification = document.getElementById('notification');
            const notificationMessage = document.getElementById('notification-message');
            
            // Create floating particles
            createParticles();
            
            // Card switching animations
            showSignupLink.addEventListener('click', (e) => {
                e.preventDefault();
                loginCard.classList.add('animate__fadeOutLeft');
                setTimeout(() => {
                    loginCard.classList.add('hidden');
                    loginCard.classList.remove('animate__fadeOutLeft');
                    signupCard.classList.remove('hidden');
                    signupCard.classList.add('animate__fadeInRight');
                }, 500);
            });

            showLoginLink.addEventListener('click', (e) => {
                e.preventDefault();
                signupCard.classList.add('animate__fadeOutRight');
                setTimeout(() => {
                    signupCard.classList.add('hidden');
                    signupCard.classList.remove('animate__fadeOutRight');
                    loginCard.classList.remove('hidden');
                    loginCard.classList.add('animate__fadeInLeft');
                }, 500);
            });

            // Login form submission
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const role = roleSelector.value;
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;
                
                // Default credentials
                const defaultAdminEmail = "admin@example.com";
                const defaultAdminPass = "admin";
                const defaultUserEmail = "user@example.com";
                const defaultUserPass = "user";
                
                // Simple validation
                if (!email || !password) {
                    showNotification("Please fill in all fields", "error");
                    animateShake(loginCard);
                    return;
                }
                
                // Handle student login differently
                if (role === "student") {
                    // For student login, redirect to student login page
                    window.location.href = 'student.html';
                    return;
                }
                
                // Check credentials for admin and user
                let isValid = false;
                if (role === "admin") {
                    isValid = (email === defaultAdminEmail && password === defaultAdminPass);
                } else if (role === "user") {
                    isValid = (email === defaultUserEmail && password === defaultUserPass);
                }
                
                if (isValid) {
                    showNotification(`Logging in as ${role}...`, "success");
                    loginCard.classList.add('animate__fadeOut');
                    setTimeout(() => {
                        if (role === 'admin') {
                            window.location.href = 'admin.html';
                        } else if (role === 'user') {
                            window.location.href = 'user.html';
                        }
                    }, 1500);
                } else {
                    showNotification("Invalid credentials!", "error");
                    animateShake(loginCard);
                }
            });

            // Signup form submission
            signupForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('signup-name').value;
                const email = document.getElementById('signup-email').value;
                const password = document.getElementById('signup-password').value;
                const confirmPassword = document.getElementById('confirm-password').value;
                
                // Validation
                if (!name || !email || !password || !confirmPassword) {
                    showNotification("Please fill in all fields", "error");
                    animateShake(signupCard);
                    return;
                }
                
                if (password !== confirmPassword) {
                    showNotification("Passwords do not match!", "error");
                    animateShake(signupCard);
                    return;
                }
                
                // Simulate signup process
                showNotification("Account created successfully!", "success");
                signupCard.classList.add('animate__fadeOut');
                setTimeout(() => {
                    signupCard.classList.add('hidden');
                    signupCard.classList.remove('animate__fadeOut');
                    loginCard.classList.remove('hidden');
                    loginCard.classList.add('animate__fadeIn');
                }, 1500);
            });
            
            // Create floating particles
            function createParticles() {
                const particlesContainer = document.getElementById('particles');
                const particleCount = 30;
                
                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('div');
                    particle.classList.add('particle');
                    
                    // Random size
                    const size = Math.random() * 10 + 2;
                    particle.style.width = `${size}px`;
                    particle.style.height = `${size}px`;
                    
                    // Random position
                    particle.style.left = `${Math.random() * 100}%`;
                    particle.style.top = `${Math.random() * 100}%`;
                    
                    // Random animation delay and duration
                    const delay = Math.random() * 15;
                    const duration = 15 + Math.random() * 10;
                    particle.style.animationDelay = `${delay}s`;
                    particle.style.animationDuration = `${duration}s`;
                    
                    particlesContainer.appendChild(particle);
                }
            }
            
            // Shake animation for errors
            function animateShake(element) {
                element.classList.add('animate__shakeX');
                setTimeout(() => {
                    element.classList.remove('animate__shakeX');
                }, 1000);
            }
            
            // Show notification
            function showNotification(message, type) {
                notificationMessage.textContent = message;
                notification.className = `notification ${type} show`;
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }
        });
    </script>
</body>
</html>
